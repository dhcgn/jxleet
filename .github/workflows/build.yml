name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.11

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build, vet and test
        run: task check

      - name: Race tests (pure Go packages)
        env:
          CGO_ENABLED: '1'
        run: go test -race ./internal/...

      - name: Frontend type check
        working-directory: frontend
        run: npm run check

  lint:
    name: Lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # frontend/dist is git-ignored but required by the //go:embed directive in
      # main.go, so the Go linter can load the package. Create a placeholder.
      - name: Stage embed placeholder
        run: |
          New-Item -ItemType Directory -Force -Path frontend/dist | Out-Null
          New-Item -ItemType File -Force -Path frontend/dist/.gitkeep | Out-Null

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
