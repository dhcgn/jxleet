name: Release

on:
  push:
    tags: ["v*"] # release: push a tag like v1.2.3, or a pre-release like v1.3.0-rc.1
    branches: [dev] # beta release: every push to dev
    # Skip beta builds for docs-only pushes. Note: GitHub does not evaluate
    # path filters for tag pushes, so tagged releases always run.
    paths-ignore: ["**.md"]

permissions:
  contents: write # create releases and (for betas) tags

jobs:
  release:
    name: Release (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so beta versions can find the latest tag

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.11

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # Tagged release: version = the pushed tag. A semver pre-release
            # tag (v1.3.0-rc.1, -beta.2) publishes as a pre-release.
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
            fi
          else
            # Beta release from dev: latest STABLE tag + beta suffix (unique per run).
            # Repo-wide highest v* tag, excluding pre-release tags — git describe would
            # find the previous beta tag in dev's ancestry, and stable tags on
            # main's merge commits are not ancestors of dev at all.
            LATEST=$(git tag -l 'v*' --sort=-v:refname | grep -v -- '-' | head -n1)
            LATEST=${LATEST:-v0.0.0}
            echo "version=${LATEST}-beta.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: task build

      # README promise: "Download the latest release, unzip, run jxleet.exe.
      # No installer" — so the artifact is a zip with the exe at its root.
      - name: Zip and checksums
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir dist
          cp bin/jxleet.exe dist/
          cd dist
          7z a "jxleet_${VERSION#v}_windows_amd64.zip" jxleet.exe
          rm jxleet.exe
          sha256sum * > SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          files: dist/*
